name: Frontend
on:
  workflow_call:
  workflow_dispatch:
jobs:
  Frontend:
    # Pinned: ubuntu-latest is now Ubuntu 26.04, where the Playwright version we
    # use cannot install Chromium. Go back to ubuntu-latest after upgrading it.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Cache the node_modules dir
      uses: actions/cache@v3
      with:
        path: node_modules
        key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
    - name: Format
      run: make frontend-checkformatting
    - name: Lint
      run: make frontend-lint
    - name: Typecheck
      run: make frontend-typecheck
    - name: Test
      run: make frontend-tests
